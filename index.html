<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Resume Screener</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 40px 20px; color: #333; }
        .container { max-width: 850px; margin: auto; background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
        h1 { margin-top: 0; color: #263238; }
        .description { color: #666; margin-bottom: 25px; }
        .section { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 6px; }
        h3 { margin-top: 0; color: #37474f; }
        input[type="file"] { margin: 10px 0; }
        textarea { width: 100%; height: 140px; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        button { background-color: #1976d2; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1565c0; }
        .result { margin-top: 20px; padding: 15px; background-color: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; line-height: 1.6; }
        .hidden { display: none; }
        .score { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .decision { font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .skills { margin-top: 10px; }
        .skill { display: inline-block; background-color: #e3f2fd; padding: 5px 9px; margin: 4px; border-radius: 4px; font-size: 13px; }
        .resume-text { margin-top: 20px; max-height: 250px; overflow-y: auto; white-space: pre-wrap; border-top: 1px solid #ddd; padding-top: 15px; color: #555; }
    </style>
</head>
<body>
<div class="container">
    <h1>Smart Resume Screener</h1>
    <p class="description">Upload a candidate resume and compare it with a job description.</p>
    
    <div class="section">
        <h3>1. Upload Candidate Resume</h3>
        <input type="file" id="resumeInput" accept=".pdf"><br>
        <button onclick="uploadResume()">Extract Resume</button>
        <div id="resumeResult" class="result hidden"></div>
    </div>

    <div class="section">
        <h3>2. Enter Job Description</h3>
        <textarea id="jobDescInput" placeholder="Paste the job requirements here..."></textarea><br>
        <button onclick="scoreResume()">Generate Match Score</button>
        <div id="scoreResult" class="result hidden"></div>
    </div>
</div>

<script>
let extractedResumeText = "";
let resumeId = null;

// This automatically detects if you are testing locally or running live on Render
const getBaseUrl = () => {
    if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return 'http://localhost:3001';
    }
    return ''; // Uses relative path when live on Render
};

async function uploadResume() {
    const fileInput = document.getElementById("resumeInput");
    const resultDiv = document.getElementById("resumeResult");

    if (fileInput.files.length === 0) return alert("Please select a PDF resume.");

    const formData = new FormData();
    formData.append("resume", fileInput.files[0]);

    resultDiv.classList.remove("hidden");
    resultDiv.innerText = "Extracting resume information...";

    try {
        const response = await fetch(`${getBaseUrl()}/upload`, { method: "POST", body: formData });
        const data = await response.json();

        if (!response.ok) {
            resultDiv.innerText = data.error;
            return;
        }

        extractedResumeText = data.text;
        resumeId = data.resumeId;

        let skillsHtml = data.skills.length > 0 
            ? data.skills.map(skill => `<span class="skill">${skill}</span>`).join('') 
            : "No known skills detected.";

        resultDiv.innerHTML = `
            <strong>Resume extracted successfully.</strong><br><br>
            <strong>Skills:</strong><div class="skills">${skillsHtml}</div><br>
            <strong>Experience:</strong><br>${data.experience}<br><br>
            <strong>Education:</strong><br>${data.education}
            <div class="resume-text"><strong>Extracted Text:</strong><br><br>${data.text}</div>
        `;
    } catch (error) {
        resultDiv.innerText = "Unable to connect to the server. Is your terminal running 'node index.js'?";
    }
}

async function scoreResume() {
    const jobDescription = document.getElementById("jobDescInput").value;
    const resultDiv = document.getElementById("scoreResult");

    if (!extractedResumeText) return alert("Please extract a resume first.");
    if (!jobDescription.trim()) return alert("Please enter a job description.");

    resultDiv.classList.remove("hidden");
    resultDiv.innerText = "Analyzing the resume. Please wait...";

    try {
        const response = await fetch(`${getBaseUrl()}/score`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ resumeId, resumeText: extractedResumeText, jobDescription })
        });
        
        const data = await response.json();
        if (!response.ok) {
            resultDiv.innerText = data.error;
            return;
        }

        resultDiv.innerHTML = `
            <div class="score">Match Score: ${data.matchScore}/100</div>
            <div class="decision">Decision: ${data.decision}</div><hr>
            <div>${data.matchResult.replace(/\n/g, "<br>")}</div>
        `;
    } catch (error) {
        resultDiv.innerText = "Unable to connect to the server.";
    }
}
</script>
